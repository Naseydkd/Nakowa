<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Authentication Nakowa</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-container { max-width: 600px; margin: 0 auto; }
        .test-result { 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 4px; 
            border-left: 4px solid;
        }
        .success { background: #d4edda; border-color: #28a745; color: #155724; }
        .error { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        .info { background: #d1ecf1; border-color: #17a2b8; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Test d'Authentication Nakowa</h1>
        
        <div class="test-section">
            <h3>Test de connexion Backend API</h3>
            <button onclick="testBackendConnection()">Tester la connexion Backend</button>
            <div id="backendTest"></div>
        </div>

        <div class="test-section">
            <h3>Test d'authentification Admin</h3>
            <button onclick="testAdminLogin()">Tester Admin Login</button>
            <div id="adminTest"></div>
        </div>

        <div class="test-section">
            <h3>Test d'authentification Agent</h3>
            <button onclick="testAgentLogin()">Tester Agent Login</button>
            <div id="agentTest"></div>
        </div>

        <div class="test-section">
            <h3>Test de requête authentifiée</h3>
            <button onclick="testAuthenticatedRequest()">Tester requête protégée</button>
            <div id="authRequestTest"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api';
        let authToken = null;

        function displayResult(elementId, type, message, data = null) {
            const element = document.getElementById(elementId);
            element.innerHTML = `
                <div class="test-result ${type}">
                    <strong>${type.toUpperCase()}:</strong> ${message}
                    ${data ? `<pre>${JSON.stringify(data, null, 2)}</pre>` : ''}
                </div>
            `;
        }

        async function testBackendConnection() {
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'OPTIONS'
                });
                displayResult('backendTest', 'success', 'Backend accessible et CORS configuré');
            } catch (error) {
                displayResult('backendTest', 'error', `Erreur de connexion: ${error.message}`);
            }
        }

        async function testAdminLogin() {
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'admin@nakowa.com',
                        password: 'admin123'
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                authToken = data.access_token;
                displayResult('adminTest', 'success', 'Connexion Admin réussie!', {
                    user: data.user,
                    token_preview: data.access_token.substring(0, 50) + '...'
                });
            } catch (error) {
                displayResult('adminTest', 'error', `Erreur Admin: ${error.message}`);
            }
        }

        async function testAgentLogin() {
            try {
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'agent@nakowa.com',
                        password: 'agent123'
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                displayResult('agentTest', 'success', 'Connexion Agent réussie!', {
                    user: data.user,
                    token_preview: data.access_token.substring(0, 50) + '...'
                });
            } catch (error) {
                displayResult('agentTest', 'error', `Erreur Agent: ${error.message}`);
            }
        }

        async function testAuthenticatedRequest() {
            if (!authToken) {
                displayResult('authRequestTest', 'error', 'Aucun token disponible. Connectez-vous d\'abord avec Admin.');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/me`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json',
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                displayResult('authRequestTest', 'success', 'Requête authentifiée réussie!', data);
            } catch (error) {
                displayResult('authRequestTest', 'error', `Erreur requête auth: ${error.message}`);
            }
        }

        // Test automatique au chargement
        window.addEventListener('load', () => {
            displayResult('backendTest', 'info', 'Prêt à tester...');
            displayResult('adminTest', 'info', 'Prêt à tester...');
            displayResult('agentTest', 'info', 'Prêt à tester...');
            displayResult('authRequestTest', 'info', 'Connectez-vous d\'abord...');
        });
    </script>
</body>
</html>
